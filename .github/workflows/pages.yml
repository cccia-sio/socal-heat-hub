name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The deploy gate. These tests are the only thing between a push and a public
  # leak: they assert the staging step below stays an allow-list, that geocoder
  # output is escaped before reaching innerHTML, and that CDN scripts keep their
  # SRI hashes. Running them locally is optional, and a push that skipped it
  # already shipped a red main once. They import nothing beyond pytest and the
  # standard library — no geopandas, no numpy — so the gate costs ~10 seconds.
  #
  # Permissions are per-job, not workflow-wide: the job that executes repo test
  # code has no business holding `pages: write` or `id-token: write`.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install pytest==8.4.2

      - run: pytest -q

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/configure-pages@v6

      # ALLOW-LIST, not a deny-list. Nothing reaches the public site unless it is
      # named below. The previous rsync excluded a handful of paths and shipped
      # everything else, which silently published ARCHITECTURE.md, CLAUDE.md,
      # tests/, docs/, and internal review PDFs. Adding a file to the repo must
      # never publish it by default. `cp` fails loudly on a missing source, so a
      # renamed asset breaks the build instead of quietly vanishing from the site.
      - name: Stage site (explicit allow-list)
        run: |
          set -euo pipefail
          mkdir -p _site/main _site/userguide _site/assets
          mkdir -p _site/data/context/overlays _site/data/exposure/processed/landsat

          # Pages shell
          cp .nojekyll index.html _site/
          cp LICENSE DATA_LICENSE.md _site/

          # Viewer + user guide (the three linked pages)
          cp main/heat_risk_map.html _site/main/
          cp userguide/index.html _site/userguide/
          cp userguide/figure_hero_composite.png userguide/figure_compare_scenarios.png _site/userguide/

          # Logos referenced by the linked pages (sio_logoCroped.png is unused)
          cp assets/ccsd_logo.png assets/sio_logo.png assets/usd-logo-horizontal.png _site/assets/

          # Raster/vector overlays the viewer fetches at runtime. Named one file
          # at a time rather than `cp -R` on the directories: a recursive copy is
          # the deny-list pattern in miniature — it publishes whatever lands in
          # those directories next, which is exactly the default this allow-list
          # exists to remove. Every path below is a literal string in the built
          # viewer; nothing constructs an asset URL at runtime.
          #
          # Both directories also hold build-time-only files that must NOT ship:
          # the `*_bounds.json` and the `downscaled_*` rasters are read by
          # build_diy_pca_viewer.py and base64-inlined into the HTML, so serving
          # them again is 1.1 MB of dead weight.
          cp data/context/sandag_landuse.pmtiles _site/data/context/
          cp data/context/overlays/population_4326.png \
             data/context/overlays/population_4326_cb.png \
             data/context/overlays/impervious_4326.png \
             data/context/overlays/impervious_4326_cb.png \
             data/context/overlays/canopy_4326.png \
             data/context/overlays/canopy_4326_cb.png \
             _site/data/context/overlays/
          cp data/exposure/processed/landsat/annual_lst_4326.png \
             data/exposure/processed/landsat/annual_lst_4326_cb.png \
             _site/data/exposure/processed/landsat/

          echo "--- staged for deploy ---"
          find _site -type f | sort

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
